# Approach Scope - default settings.  DON'T EDIT THIS FILE.
#
# Your own settings live in config.ini, which `bash run.sh --setup` creates and which is
# never included in a download or update.  To change anything below, copy the line (with
# its [Section] heading) into config.ini and change it there.

[Home]
# Where you watch from. Set by:  bash run.sh --setup
# NAME = HOME
# LAT  =
# LON  =
# EYE_HEIGHT_M =

[Airport]
# Set by setup. Adelaide's detailed data is built in; any other airport is generated into local/.
DATA_FILE = data/airport_ypad.json
# The approach you can see. Used until real traffic shows which runway is in use.
# HOME_RUNWAY =

[Feed]
# {lat} {lon} are filled in with the airport position, {radius} with RADIUS_NM.
# A local tar1090 works too, e.g.  URL = http://192.168.1.50/tar1090/data/aircraft.json
URL = https://opendata.adsb.fi/api/v3/lat/{lat}/lon/{lon}/dist/{radius}
RADIUS_NM = 45
# Seconds between updates. adsb.fi asks for no more than one request a second; 5 is polite.
INTERVAL = 5
TIMEOUT = 8
MIL_PREFIX_LIST = 7CF

[Extras]
# Where each flight has come from (adsbdb.com) and airport wind / QNH (aviationweather.gov).
ROUTES = true
WEATHER = true
# Remember landings between restarts (arrivals_log.json).
KEEP_ARRIVALS_LOG = true

[Audio]
ATC_STREAM_URL =
AUTO_START = false

[Display]
FULLSCREEN = true
FPS = 15
# day = full brightness, night = dimmed, auto = switches at sunset and sunrise where you are.
MODE = auto
# When nothing is arriving, show the day's stats in place of the map (true), or keep the map
# and only show the stats during curfew (false). The R key shows the stats at any time.
STATS_WHEN_QUIET = true
# Flash the whole screen red (with the flight number) when an arrival goes around.
GO_AROUND_ALERT = true
ALERT_SECONDS = 30
# Faint scanlines for a retro look (off = cleanest picture).
CRT_EFFECT = false
# Show aircraft that are not arriving (departures, overflights, trainers) as dim symbols.
SHOW_OTHER_TRAFFIC = true
CLOCK_24H = true
